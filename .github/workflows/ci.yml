name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The job runs where the LARGE_RUNNER variable says: `sovereign-linux-large`, the self-hosted runners on
# the cluster (Actions Runner Controller, sovereign-media/sovereign#1547), or GitHub's runners when it
# is unset. The self-hosted image is the stock `ghcr.io/actions/actions-runner` (Ubuntu 24.04, no
# JDK, Android SDK or zstd), so the job installs what it needs itself, in a way that also works on
# GitHub's runners.
jobs:
  build:
    runs-on: ${{ vars.MEDIUM_RUNNER || vars.LARGE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      # Installs what the self-hosted image lacks, before setup-gradle's cache: without zstd it
      # saves gzip entries, and those and the zstd ones GitHub's runners save cannot restore each
      # other, so every cache is stored twice (sovereign-media/sovereign#1552).
      - name: Set up the runner
        uses: sovereign-media/actions/setup-runner@7c1e75a8ac4ac92c10507edd13f535a8569b5fe1 # v1.0.0

      # Downloads the JDK into the tool cache on either kind of runner.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # GitHub's runners have an SDK to add to; on the self-hosted image there is none, so the
      # action installs one into ~/.android/sdk, which the non-root runner user can write.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build
        run: ./gradlew :core:test :app:testDebugUnitTest :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
