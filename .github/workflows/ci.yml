name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue: each queued pull request is tested on top of main before it merges, so the
  # required check must run here too.
  merge_group:

permissions:
  contents: read

# Only a pull request's runs are cancelled by a newer push: a push to main seeds the caches the
# pull requests read, and a cancelled one would leave them stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The job runs on GitHub's runners (`ubuntu-latest`): the repository is public, so they are free.
# The MEDIUM_RUNNER and LARGE_RUNNER variables name other runners when set; the organisation's own
# (`sovereign-linux-*`, on the cluster) are for its private repositories only, never a public one,
# whose pull requests run code from anyone. A public repository cannot use the organisation's
# private actions either, so every step here is a public action.
jobs:
  build:
    runs-on: ${{ vars.MEDIUM_RUNNER || vars.LARGE_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7

      # Downloads the JDK into the tool cache.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Adds the platform and build tools the app compiles against to the runner's SDK.
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0"

      # Caches the Gradle home, the build cache's outputs with it (org.gradle.caching). Only runs
      # on main write it (setup-gradle is read-only on any other branch), so each push to main
      # seeds it and pull requests and the merge queue build from what main compiled.
      - uses: gradle/actions/setup-gradle@v6

      - name: Test and build
        run: ./gradlew spotlessCheck :core:test :app:testDebugUnitTest :app:assembleDebug --console=plain

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
