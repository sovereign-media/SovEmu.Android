# Every operation the Android app sends. Apollo generates typed Kotlin for each from
# schema.graphqls (SovEmu.Server's schema), so a field the server does not have fails the build.

fragment UserFields on User {
  id
  username
  isAdmin
}

fragment SaveFields on SaveSlot {
  slot
  savedAt
  screenshotUrl
}

fragment GameFields on Game {
  id
  system
  title
  fileTitle
  tags
  path
  size
  lastPlayedAt
  playCount
  # Artwork at the widths it is shown at (pixels, for a 1080p TV or a phone): a lossy WebP copy
  # of each, made once by the server. Backdrops, the box over one, cards.
  image: mediaUrl(kind: IMAGE, width: 1600)
  imageSmall: mediaUrl(kind: IMAGE, width: 480)
  cover: mediaUrl(kind: THUMB, width: 800)
  thumb: mediaUrl(kind: THUMB, width: 400)
  video: mediaUrl(kind: VIDEO)
  description
  releaseDate
  developer
  publisher
  genre
  genres
  players
  rating
  esrb
  # The rating's icon, from the server's decoration set (an admin may replace it).
  esrbBadgeUrl
  modes
  series
  themes
  discs
  partKind
  favourite
  release
  patch
  autoSave {
    slot
    savedAt
    screenshotUrl
  }
}

fragment SystemFields on System {
  id
  name
  short
  manufacturer
  year
  color
  photoUrl
  gameCount
  playable
  needsGpu
  rendering
  biosMissing
  boxAspect
}

fragment SessionFields on GameSession {
  id
  gameId
  system
  title
  core
  width
  height
  fps
  connected
  discs
  disc
}

fragment MappingFields on ControllerMapping {
  controller
  system
  name
  source
  bindings {
    input
    button
  }
}

fragment LayoutFields on PadLayout {
  id
  name
  width
  height
  body {
    x
    y
    w
    h
    r
    tone
  }
  keys {
    key
    label
    x
    y
    w
    h
    r
  }
}

# Where and how to sign in at this address: asked first, signed out, which also tells the app a
# SovEmu server is there.
query Bootstrap {
  bootstrapConfig {
    signInAvailable
    address
    # The client a TV, or an app signing in with a code or a password, signs in as.
    deviceClientId
    tokenEndpoint
    revocationEndpoint
    # Where to ask for a code to show, and where the person approves it.
    deviceAuthorizationEndpoint
    verificationUri
    passwordEndpoint
    # A phone's sign-in through the system browser: the code flow with PKCE, as the mobile
    # client, back to the app's own scheme.
    authorizationEndpoint
    mobileClientId
    mobileRedirectUri
  }
}

# Signs a TV in as this user: the code its "Sign in with your phone" screen shows.
mutation ApproveDeviceCode($code: String!) {
  approveDeviceCode(userCode: $code)
}

query Viewer {
  viewer {
    setupRequired
    user {
      ...UserFields
    }
  }
}

query ClientConfig {
  clientConfig {
    iceServers
  }
}

query Systems {
  systems {
    ...SystemFields
  }
}

query Home {
  home {
    featured {
      ...GameFields
    }
    recent {
      ...GameFields
    }
    added {
      ...GameFields
    }
    favourites {
      ...GameFields
    }
    topRated {
      ...GameFields
    }
  }
  collections {
    id
    name
    games {
      ...GameFields
    }
  }
}

query Search($text: String!) {
  search(text: $text) {
    ...GameFields
  }
}

query Patches($id: Int!) {
  game(id: $id) {
    patches {
      id
      name
      isDefault
    }
  }
}

mutation SetPatch($gameId: Int!, $patchId: Int) {
  setPatch(gameId: $gameId, patchId: $patchId)
}

query GameDecoration($id: Int!) {
  game(id: $id) {
    decoration {
      url
      width
      height
      top
      left
      bottom
      right
    }
  }
}

query CollectionChoices($id: Int!) {
  collections {
    id
    name
  }
  game(id: $id) {
    collectionIds
  }
}

mutation NameDevice($name: String!) {
  nameDevice(name: $name)
}

mutation SetFavourite($gameId: Int!, $favourite: Boolean!) {
  setFavourite(gameId: $gameId, favourite: $favourite)
}

mutation CreateCollection($name: String!) {
  createCollection(name: $name) {
    id
    name
  }
}

mutation SetInCollection($collectionId: Int!, $gameId: Int!, $member: Boolean!) {
  setInCollection(collectionId: $collectionId, gameId: $gameId, member: $member)
}

query SystemGames($id: ID!) {
  system(id: $id) {
    games {
      ...GameFields
    }
  }
}

query Saves($id: Int!) {
  game(id: $id) {
    saves {
      ...SaveFields
    }
  }
}

mutation StartSession($gameId: Int!, $startId: String, $slot: Int) {
  startSession(gameId: $gameId, startId: $startId, slot: $slot) {
    ...SessionFields
  }
}

query CurrentSession {
  currentSession {
    ...SessionFields
  }
}

query StartProgress($startId: String!) {
  startProgress(startId: $startId) {
    phase
    read
    total
    elapsedMs
    phaseMs
    error
  }
}

mutation SessionOffer($id: ID!, $sdp: String!, $client: String, $capabilities: ClientCapabilitiesInput) {
  sessionOffer(id: $id, sdp: $sdp, client: $client, capabilities: $capabilities)
}

mutation SetDisc($sessionId: ID!, $disc: Int!) {
  setDisc(sessionId: $sessionId, disc: $disc)
}

mutation StopSession($id: ID!) {
  stopSession(id: $id)
}

mutation SaveState($sessionId: ID!, $slot: Int!) {
  saveState(sessionId: $sessionId, slot: $slot)
}

mutation LoadState($sessionId: ID!, $slot: Int!) {
  loadState(sessionId: $sessionId, slot: $slot)
}

query ControllerMappings($system: ID) {
  controllerMappings(system: $system) {
    ...MappingFields
  }
}

mutation SaveControllerMapping($controller: String!, $system: ID, $name: String!, $bindings: [BindingInput!]!) {
  saveControllerMapping(controller: $controller, system: $system, name: $name, bindings: $bindings) {
    ...MappingFields
  }
}

mutation ResetControllerMapping($controller: String!, $system: ID) {
  resetControllerMapping(controller: $controller, system: $system)
}

# A system's labels and pad, and the controllers' pads.
query Controls($id: ID!) {
  system(id: $id) {
    controls {
      buttons {
        button
        label
      }
      sticks {
        stick
        label
        key
      }
      layout {
        ...LayoutFields
      }
    }
  }
  controllerLayouts {
    ...LayoutFields
  }
}

fragment CheatFields on Cheat {
  id
  description
  code
  enabled
}

query Cheats($id: Int!) {
  game(id: $id) {
    cheats {
      ...CheatFields
    }
  }
}

mutation AddCheat($gameId: Int!, $code: String!, $description: String!) {
  addCheat(gameId: $gameId, code: $code, description: $description) {
    ...CheatFields
  }
}

mutation SetCheatEnabled($gameId: Int!, $cheatId: Int!, $enabled: Boolean!) {
  setCheatEnabled(gameId: $gameId, cheatId: $cheatId, enabled: $enabled) {
    ...CheatFields
  }
}

mutation DeleteCheat($gameId: Int!, $cheatId: Int!) {
  deleteCheat(gameId: $gameId, cheatId: $cheatId)
}

mutation ReportClientEvents($client: String!, $events: [ClientEventInput!]!) {
  reportClientEvents(client: $client, events: $events)
}

# The background behind every screen, the server's (the admin's choice); null for none.
query Background {
  background {
    id
    url
  }
}
