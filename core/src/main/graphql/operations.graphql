# Every operation the Android app sends. Apollo generates typed Kotlin for each from
# schema.graphqls (SovEmu.Server's schema), so a field the server does not have fails the build.

fragment UserFields on User {
  id
  username
  isAdmin
}

fragment SaveFields on SaveSlot {
  slot
  savedAt
  screenshotUrl
}

fragment GameFields on Game {
  id
  system
  title
  fileTitle
  tags
  path
  size
  lastPlayedAt
  playCount
  image: mediaUrl(kind: IMAGE)
  thumb: mediaUrl(kind: THUMB)
  video: mediaUrl(kind: VIDEO)
  description
  releaseDate
  developer
  publisher
  genre
  players
  rating
  discs
  partKind
  favourite
  release
  patch
  autoSave {
    slot
    savedAt
    screenshotUrl
  }
}

fragment SystemFields on System {
  id
  name
  short
  manufacturer
  year
  color
  gameCount
  playable
  needsGpu
  rendering
  biosMissing
}

fragment SessionFields on GameSession {
  id
  gameId
  system
  title
  core
  width
  height
  fps
  connected
  discs
  disc
}

fragment MappingFields on ControllerMapping {
  controller
  system
  name
  source
  bindings {
    input
    button
  }
}

fragment LayoutFields on PadLayout {
  id
  name
  width
  height
  body {
    x
    y
    w
    h
    r
    tone
  }
  keys {
    key
    label
    x
    y
    w
    h
    r
  }
}

# Where and how to sign in at this address: asked first, signed out, which also tells the app a
# SovEmu server is there.
query Bootstrap {
  bootstrapConfig {
    signInAvailable
    address
    nativeClientId
    tokenEndpoint
    revocationEndpoint
    passwordEndpoint
  }
}

query Viewer {
  viewer {
    setupRequired
    user {
      ...UserFields
    }
  }
}

query ClientConfig {
  clientConfig {
    iceServers
  }
}

query Systems {
  systems {
    ...SystemFields
  }
}

query Home {
  home {
    featured {
      ...GameFields
    }
    recent {
      ...GameFields
    }
    added {
      ...GameFields
    }
    favourites {
      ...GameFields
    }
  }
  collections {
    id
    name
    games {
      ...GameFields
    }
  }
}

query Search($text: String!) {
  search(text: $text) {
    ...GameFields
  }
}

query Patches($id: Int!) {
  game(id: $id) {
    patches {
      id
      name
      isDefault
    }
  }
}

mutation SetPatch($gameId: Int!, $patchId: Int) {
  setPatch(gameId: $gameId, patchId: $patchId)
}

query GameDecoration($id: Int!) {
  game(id: $id) {
    decoration {
      url
      width
      height
      top
      left
      bottom
      right
    }
  }
}

query CollectionChoices($id: Int!) {
  collections {
    id
    name
  }
  game(id: $id) {
    collectionIds
  }
}

mutation SetFavourite($gameId: Int!, $favourite: Boolean!) {
  setFavourite(gameId: $gameId, favourite: $favourite)
}

mutation CreateCollection($name: String!) {
  createCollection(name: $name) {
    id
    name
  }
}

mutation SetInCollection($collectionId: Int!, $gameId: Int!, $member: Boolean!) {
  setInCollection(collectionId: $collectionId, gameId: $gameId, member: $member)
}

query SystemGames($id: ID!) {
  system(id: $id) {
    games {
      ...GameFields
    }
  }
}

query Saves($id: Int!) {
  game(id: $id) {
    saves {
      ...SaveFields
    }
  }
}

mutation StartSession($gameId: Int!) {
  startSession(gameId: $gameId) {
    ...SessionFields
  }
}

mutation SessionOffer($id: ID!, $sdp: String!) {
  sessionOffer(id: $id, sdp: $sdp)
}

mutation SetDisc($sessionId: ID!, $disc: Int!) {
  setDisc(sessionId: $sessionId, disc: $disc)
}

mutation StopSession($id: ID!) {
  stopSession(id: $id)
}

mutation SaveState($sessionId: ID!, $slot: Int!) {
  saveState(sessionId: $sessionId, slot: $slot)
}

mutation LoadState($sessionId: ID!, $slot: Int!) {
  loadState(sessionId: $sessionId, slot: $slot)
}

query ControllerMappings($system: ID) {
  controllerMappings(system: $system) {
    ...MappingFields
  }
}

mutation SaveControllerMapping($controller: String!, $system: ID, $name: String!, $bindings: [BindingInput!]!) {
  saveControllerMapping(controller: $controller, system: $system, name: $name, bindings: $bindings) {
    ...MappingFields
  }
}

mutation ResetControllerMapping($controller: String!, $system: ID) {
  resetControllerMapping(controller: $controller, system: $system)
}

# A system's labels and pad, and the controllers' pads.
query Controls($id: ID!) {
  system(id: $id) {
    controls {
      buttons {
        button
        label
      }
      layout {
        ...LayoutFields
      }
    }
  }
  controllerLayouts {
    ...LayoutFields
  }
}

fragment CheatFields on Cheat {
  id
  description
  code
  enabled
}

query Cheats($id: Int!) {
  game(id: $id) {
    cheats {
      ...CheatFields
    }
  }
}

mutation AddCheat($gameId: Int!, $code: String!, $description: String!) {
  addCheat(gameId: $gameId, code: $code, description: $description) {
    ...CheatFields
  }
}

mutation SetCheatEnabled($gameId: Int!, $cheatId: Int!, $enabled: Boolean!) {
  setCheatEnabled(gameId: $gameId, cheatId: $cheatId, enabled: $enabled) {
    ...CheatFields
  }
}

mutation DeleteCheat($gameId: Int!, $cheatId: Int!) {
  deleteCheat(gameId: $gameId, cheatId: $cheatId)
}
