# The daemon: 4 GB, the parallel collector. GitHub's runners for a public repository have 16 GB.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
# Modules build at the same time where the graph lets them.
org.gradle.parallel=true
# Task outputs are reused from the local build cache (~/.gradle/caches/build-cache-1), so a clean
# build, a branch switch or a new worktree takes what an earlier build already made. In CI,
# setup-gradle saves the cache from main's runs, and pull requests read it.
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
# Each module's R class holds only its own resources (no code here reads another library's R).
android.nonTransitiveRClass=true
# Library modules stay out of the dependency constraints AGP publishes: faster to configure,
# and what AGP 9's warning asks for (as Sovereign.Android found, its other spelling,
# excludeLibraryComponentsFromConstraints, is itself deprecated).
android.dependency.useConstraints=false
kotlin.code.style=official
